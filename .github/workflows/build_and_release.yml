name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Find and Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching root build outputs..."
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" app-release.apk
          echo "apk_path=app-release.apk" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "亲情空间 v1.1.0 (后台静默位置守护版)"
          body: |
            ### 亲情空间 v1.1.0 (后台静默位置守护版)

            #### 🌟 更新内容：
            1. **后台静默位置守护服务**：手机锁屏/息屏无需打开 App，全天候静默测距与多端云同步。
            2. **出租屋电子围栏报平安**：到达出租屋自动记录并推送安全到家。
            3. **电池优化与常驻保活引导**：一键引导加入系统后台无限制白名单。
            4. **在线版本更新检测**：内置直接下载 APK 并自动调用系统安装升级。
          files: app-release.apk
          generate_release_notes: false
          draft: false
          prerelease: false
